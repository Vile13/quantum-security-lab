name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch makes the running job obsolete; cancelling it
# keeps the queue short rather than burning minutes on a superseded commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned: an unpinned linter turns an unrelated upstream release into a
      # red build on a commit that changed nothing.
      - name: Install ruff
        run: pip install ruff==0.16.1

      - name: Lint
        run: ruff check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the declared floor -- the code uses zip(strict=) and PEP 604
        # annotations. 3.12 is what the committed results were produced with.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: qml-noise-robustness/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r qml-noise-robustness/requirements.txt
          pip install pytest==7.4.4

      - name: Run tests
        run: pytest -q
